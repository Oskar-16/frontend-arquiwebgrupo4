<div class="container">
  <div style="text-align: center; margin: 3%"><h2>Registro de Verificaciones</h2></div>
  <div style="text-align: center">
    <form [formGroup]="form" (submit)="aceptar()">
      <mat-form-field class="example-full-width">
        <mat-label>Correo</mat-label>
        <input matInput placeholder="ejemplo@gmail.com" formControlName="correo" />
        <mat-error>
          @if (form.get('correo')?.hasError('required')) {
            ¡El correo no existe!
          }          
        </mat-error>
      </mat-form-field>
      <br />
      <mat-form-field class="example-full-width">
        <mat-label>Documento</mat-label>
        <input matInput placeholder="12345678" formControlName="documento" />
      </mat-form-field>
      <br />
      <mat-form-field>
        <mat-label>Registro</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="registro" />
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <br />
      <mat-form-field>
        <mat-label>Estado</mat-label>
        <mat-select formControlName="nivel">
          @for (food of estados; track food) {
            <mat-option [value]="food.value">{{ food.viewValue }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br />

      <mat-form-field>
        <mat-label>Observacion</mat-label>
        <textarea matInput formControlName="observacion"></textarea>
      </mat-form-field>
      <div>
        <button matButton="elevated">Registrar</button>
      </div>
    </form>
  </div>
</div>
