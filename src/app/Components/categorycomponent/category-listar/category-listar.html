<div class="mis-items-container">
  <div class="encabezado">
    <h1>Categorias disponibles</h1>
    <button matButton="elevated" class="btn-publicar" routerLink="/categories/insertar">
      <mat-icon>add</mat-icon>
      Publicar nueva categoria
    </button>
  </div>

  <div class="tabla-card mat-elevation-z1">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>id</th>
        <td mat-cell *matCellDef="let element">{{ element.idCategory }}</td>
      </ng-container>

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let element">{{ element.nameCategory }}</td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>parent-id</th>
        <td mat-cell *matCellDef="let element">{{ element.parent_idCategory }}</td>
      </ng-container>

      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton [routerLink]="['/categories/actualizar',element.idcategory]"aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton (click)="eliminar(element.idcategory)" class="btn-eliminar" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>

<mat-paginator
  [length]="filtradas.length"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (page)="cambiarPagina($event)">
</mat-paginator>
