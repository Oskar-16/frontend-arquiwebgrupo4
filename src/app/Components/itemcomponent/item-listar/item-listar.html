<div class="mis-items-container">
  <div class="encabezado">
    <h1>Mis items</h1>
    <button matButton="elevated" class="btn-publicar" routerLink="/items/insertaritem">
      <mat-icon>add</mat-icon>
      Publicar item
    </button>
  </div>

  <span class="badge-plan">{{ itemsActivos }} / {{ limitePlan }} items activos — plan gratuito</span>

  <div class="tabla-card mat-elevation-z1">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="item">
        <th mat-header-cell *matHeaderCellDef>Item</th>
        <td mat-cell *matCellDef="let element">
          <div class="celda-item">
            <div class="icono-item">
              <mat-icon>{{ iconoCategoria(element) }}</mat-icon>
            </div>
            <span>{{ element.titleItem }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let element">{{ element.category?.nameCategory }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">
          <span class="chip-estado" [ngClass]="estadoDe(element).clase">
            <mat-icon>{{ estadoDe(element).icono }}</mat-icon>
            {{ estadoDe(element).texto }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton [routerLink]="['/ofertas',element.idItem]" aria-label="Ver ofertas">
            <mat-icon>local_offer</mat-icon>
          </button>
          <button matIconButton [routerLink]="['/items/actualizaritem',element.idAuthor]"aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton (click)="eliminar(element.idItem)" class="btn-eliminar" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <button matFab class="fab-publicar" routerLink="/items/insertaritem" aria-label="Publicar item">
    <mat-icon>add</mat-icon>
  </button>
</div>

<mat-paginator
  [length]="filtradas.length"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (page)="cambiarPagina($event)">
</mat-paginator>
