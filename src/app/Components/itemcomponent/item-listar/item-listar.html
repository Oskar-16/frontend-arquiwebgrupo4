<div class="container">
  <h2 style="text-align: center">Lista de Items</h2>
  <div>
    <!--tabla-->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

      <!-- Position Column -->
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>ID.</th>
        <td mat-cell *matCellDef="let element">{{ element.idItem }}</td>
      </ng-container>

      <!-- title Column -->
      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>titulo</th>
        <td mat-cell *matCellDef="let element">{{ element.titleItem }}</td>
      </ng-container>

      <!-- description Column -->
      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>descripcion</th>
        <td mat-cell *matCellDef="let element">{{ element.descriptionItem }}</td>
      </ng-container>

      <!-- condition Column -->
      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>condicion</th>
        <td mat-cell *matCellDef="let element">{{ element.conditionItem }}</td>
      </ng-container>
      <!-- Status Column -->
      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef>status</th>
        <td mat-cell *matCellDef="let element">{{ element.statusItem }}</td>
      </ng-container>
      <!-- User Column -->
      <ng-container matColumnDef="c6">
        <th mat-header-cell *matHeaderCellDef>usuario</th>
        <td mat-cell *matCellDef="let element">{{ element.User }}</td>
      </ng-container>
      <!-- categoria Column -->
      <ng-container matColumnDef="c7">
        <th mat-header-cell *matHeaderCellDef>categoria</th>
        <td mat-cell *matCellDef="let element">{{ element.Category }}</td>
      </ng-container>

      <ng-container matColumnDef="c8">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let element">
          <button matButton (click)="eliminar(element.idItem)" class="btn-eliminar">
            <mat-icon>delete</mat-icon>
        </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="c9">
        <th mat-header-cell *matHeaderCellDef>Actualizar</th>
        <td mat-cell *matCellDef="let element">
          <button matButton [routerLink]="['/items/edits',element.idItem]" class="btn-eliminar">
            <mat-icon>edit</mat-icon>
        </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
