<div class="buscar-container">
  <h1>Buscar item</h1>
  <p class="subtitulo">Encuentra items disponibles por título o categoría.</p>

  <div class="filtros-buscar">
    <div class="buscador-explorar">
      <mat-icon>search</mat-icon>
      <input type="text" placeholder="Buscar items..." [(ngModel)]="busqueda" />
    </div>

    <mat-form-field appearance="outline" class="select-categoria">
      <mat-label>Categoría</mat-label>
      <mat-select [(ngModel)]="categoriaSeleccionada">
        <mat-option [value]="'todos'">Todos</mat-option>
        <mat-option *ngFor="let c of categorias" [value]="c.idCategory">
          {{ c.nameCategory }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="grid-items">
    <mat-card *ngFor="let item of resultados" class="card-item">
      <div class="imagen-item">
        <mat-icon>{{ iconoCategoria(item) }}</mat-icon>
      </div>
      <div class="info-item">
        <span class="titulo-item">{{ item.titleItem }}</span>
        <span class="categoria-item">{{ item.category?.nameCategory }}</span>
        <div class="pie-item">
          <span class="usuario-item">
            <span class="avatar-mini">{{ inicialesDe(item) }}</span>
            {{ item.user?.usernameUser }}
          </span>
          <span class="chip-estado" [ngClass]="estadoDe(item).clase">
            {{ estadoDe(item).texto }}
          </span>
        </div>
      </div>
    </mat-card>
  </div>

  <p class="vacio" *ngIf="!resultados.length">No se encontraron items.</p>
</div>
