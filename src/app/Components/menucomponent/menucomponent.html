<mat-toolbar color="primary" class="navbar">
  <div class="navbar-contenido">
    <!-- Marca -->
    <a class="marca" routerLink="/explorar">
      <mat-icon>swap_horiz</mat-icon>
      <span class="marca-texto">TuTrade</span>
    </a>

    <!-- Buscador -->
    <div class="buscador">
      <mat-icon class="buscador-icono">search</mat-icon>
      <input type="text" placeholder="Buscar items..." class="buscador-input" (input)="buscar($event)" />
    </div>

    <!-- Navegación -->
    <nav class="nav-links">
      <a matButton routerLink="/explorar" routerLinkActive="activo">Explorar</a>

      <button matButton [matMenuTriggerFor]="menuItems">Mis items</button>
      <mat-menu #menuItems="matMenu">
        <a mat-menu-item routerLink="/items/listaritem">Listar items</a>
        <a mat-menu-item routerLink="/items/insertaritem">Registrar item</a>
        <a mat-menu-item routerLink="/items/buscaritem">Buscar item</a>
      </mat-menu>

      <a matButton routerLink="/trueques" routerLinkActive="activo">Trueques</a>
      <a matButton routerLink="/kyc" routerLinkActive="activo">Verificación</a>
      <button matButton [matMenuTriggerFor]="menuCategories">categorias</button>
      
      <mat-menu #menuCategories="matMenu">
        <a mat-menu-item routerLink="/categories/listar">Todas las categorias</a>
        <a mat-menu-item routerLink="/categories/insertar">Registrar Categoria</a>
      </mat-menu>
    </nav>

    <!-- Acciones -->
    <div class="acciones">
      <button mat-icon-button aria-label="Notificaciones">
        <mat-icon>notifications</mat-icon>
      </button>

      <button mat-icon-button [matMenuTriggerFor]="menuUsuario" aria-label="Cuenta" class="avatar">
        <span class="avatar-iniciales">U</span>
      </button>
      <mat-menu #menuUsuario="matMenu">
        <button mat-menu-item (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
