@if (mostrarBienvenida) {
  <div class="bienvenida-overlay" (click)="cerrarBienvenida()">
    <div class="bienvenida-modal" (click)="$event.stopPropagation()">
      <mat-icon class="bienvenida-icono">eco</mat-icon>
      <h2>¡Bienvenido a TuTrade!</h2>
      <p>
        Intercambia lo que ya no usas y suma impacto positivo al planeta.
        ¿Te mostramos cómo funciona en 5 pasos?
      </p>
      <div class="bienvenida-acciones">
        <button type="button" class="btn-secundario" (click)="cerrarBienvenida()">Ahora no</button>
        <button type="button" class="btn-primario" (click)="irAGuia()">Ver la guía</button>
      </div>
    </div>
  </div>
}
