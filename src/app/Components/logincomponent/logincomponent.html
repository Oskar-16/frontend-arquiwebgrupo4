<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>TuTrade</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="iniciarSesion()">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="credenciales.email"
            required
            email
          />
          <mat-icon matSuffix>mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="ocultarPassword ? 'password' : 'text'"
            name="password"
            [(ngModel)]="credenciales.password"
            required
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="ocultarPassword = !ocultarPassword"
            [attr.aria-label]="'Mostrar contraseña'"
          >
            <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error) {
          <p class="error-mensaje">{{ error }}</p>
        }

        <button
          matButton="filled"
          color="primary"
          type="submit"
          class="boton-login"
          [disabled]="loginForm.invalid || cargando"
        >
          @if (cargando) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Ingresar
          }
        </button>

        <p class="link-registro">
          ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
